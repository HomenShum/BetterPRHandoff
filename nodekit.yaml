# This contract describes local file scaffolding; see HANDOFF.md for proof limits.
schemaVersion: nodekit.repo/v1
repository: HomenShum/BetterPRHandoff
lifecycle: preview
support: active
role: handoff-protocol
commandProfile: protocol
canonicalFor:
  - betterprhandoff.handoff
# The CLI does not load NodePlatform contracts or emit a NodeKit receipt.
consumes: []
commands:
  doctor: { script: test, mode: finite }
  check: { script: test, mode: finite }
  proof: { script: test, mode: finite }
noKey:
